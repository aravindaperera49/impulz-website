<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share Your Experience | IMPULZ</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="testimonial-admin.css"></head><body><header><a href="index.html"><img src="assets/LOGO_Inverted.png" alt="IMPULZ Design Studio"></a></header><main class="testimonial-tool"><h1>Share Your <em class="review-gradient">Experience.</em></h1><p>Thank you for working with IMPULZ Design Studio. We appreciate your feedback.</p><div id="review-message" role="status">Checking your invitation…</div><form id="review-form" hidden><label>Your name<input name="name" maxlength="100" required></label><label>Company (optional)<input name="company" maxlength="120"></label><label>Rating<select name="rating" required><option value="5">★★★★★ — 5 stars</option><option value="4">★★★★ — 4 stars</option><option value="3">★★★ — 3 stars</option><option value="2">★★ — 2 stars</option><option value="1">★ — 1 star</option></select></label><label>Your testimonial<textarea name="quote" minlength="15" maxlength="2000" rows="5" required></textarea></label><label>May we publish your feedback?<select name="permission"><option value="yes">Yes, with my name and company</option><option value="anonymous">Yes, anonymously</option><option value="no">No, private feedback only</option></select></label><button class="button" type="submit">Submit Testimonial →</button></form></main><script src="review-form.js"></script></body></html>
