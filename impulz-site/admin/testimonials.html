<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Testimonial Manager | IMPULZ</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../testimonial-admin.css"></head><body><header><a href="../index.html"><img src="../assets/LOGO_Inverted.png" alt="IMPULZ"></a></header><main class="testimonial-tool"><h1>Testimonial <em class="review-gradient">Manager.</em></h1><p>Private invitation and review dashboard.</p><div id="notice" role="status"></div><form id="login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button">Sign in</button></form><div id="dashboard" hidden><button id="logout" class="outline">Sign out</button><h2>Invite a client</h2><form id="invite"><label>Client name<input name="name" required maxlength="100"></label><label>Company (optional)<input name="company" maxlength="120"></label><button class="button">Generate 30-day invitation</button></form><div id="generated" hidden><label>Private invitation link<input id="invitation-link" readonly></label><button class="outline" id="copy" type="button">Copy link</button></div><h2>Pending and previous testimonials</h2><div id="reviews"></div><h2>Invitation history</h2><div id="invitations"></div></div></main><script src="../testimonial-admin.js"></script></body></html>
